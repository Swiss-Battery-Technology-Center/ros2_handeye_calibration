[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".vscode",
    "_*",
    ".git",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "C90",
    "SIM",
    "RET",
]
ignore = [
    "E402",
    "E501",
    "E203",
    "D401",
    "RET504",
    "RET505",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM117",
    "SIM118",
    "UP006",
    "UP018",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
preview = true
